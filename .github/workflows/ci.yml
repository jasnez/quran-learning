name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` does not fail on type errors in test files, so check the
      # whole project with tsc as its own step.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  a11y:
    name: Accessibility (axe)
    # Pull requests only: the same check already ran on the PR before it reached main.
    # Runs next to the job above, so it does not delay lint, tests and build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # 19 routes x 3 themes x 2 widths against its own `next dev` on port 3210;
      # known exceptions are listed by exact node in tests/e2e/a11y.spec.ts.
      - name: Axe check
        run: npm run test:a11y
